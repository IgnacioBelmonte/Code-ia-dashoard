services:
  app:
    image: ${CODE_IA_IMAGE:-code-ia-dashboard-app}
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      # Projects registry + boards (mounted read-only)
      PROJECTS_REGISTRY_PATH: /data/projects.registry.json

      # Visible build info if needed
      APP_GIT_SHA: ${APP_GIT_SHA:-}
      APP_IMAGE_TAG: ${APP_IMAGE_TAG:-}

    volumes:
      - /home/nacho/.openclaw/state/projects.registry.json:/data/projects.registry.json:ro
      - /home/nacho/.openclaw/state/projects:/data/projects:ro
